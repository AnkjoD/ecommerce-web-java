spring.application.name=ecommerce
server.port=${SERVER_PORT:6000}

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/web_ban_hang}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# JWT
jwt.access-secret=${JWT_ACCESS_SECRET:access_secret_changeme}
jwt.refresh-secret=${JWT_REFRESH_SECRET:refresh_secret_changeme}
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# CORS
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# VNPay
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:3000/orders/vnpay-return}
vnpay.payment-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html

# GHTK
ghtk.api-token=${GHTK_API_TOKEN:}
ghtk.base-url=${GHTK_BASE_URL:https://services.giaohangtietkiem.vn}
ghtk.force-mock=${GHTK_FORCE_MOCK:true}
ghtk.pick-name=${GHTK_PICK_NAME:Shop Admin}
ghtk.pick-tel=${GHTK_PICK_TEL:0987654321}
ghtk.pick-address=${GHTK_PICK_ADDRESS:123 Cau Giay}
ghtk.pick-province=${GHTK_PICK_PROVINCE:Ha Noi}
ghtk.pick-district=${GHTK_PICK_DISTRICT:Quan Cau Giay}

# AI Sidecar (Python FastAPI)
ai.sidecar-url=${AI_SIDECAR_URL:http://localhost:8000}

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
